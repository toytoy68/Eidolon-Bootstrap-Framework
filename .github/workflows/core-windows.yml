name: Core Windows candidate
on:
  workflow_dispatch:
  push:
    branches: [feat/eidolon-core-v0.1]
    paths:
      - 'eidolon-core/desktop/tauri/**'
      - 'eidolon-core/desktop/windows/**'
      - '.github/workflows/core-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eidolon-core/desktop/tauri
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts before compilation
        shell: powershell
        run: |
          Get-ChildItem ../windows/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Automatic pairing tests (synthetic credentials only)
        shell: powershell
        run: |
          powershell -NoProfile -File ../windows/test-pairing.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File ../windows/test-auto-tunnel.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/pairing.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Safe launch failure diagnostic
        shell: powershell
        run: |
          powershell -NoProfile -File ../windows/eidolon-open.ps1 -ClientExe missing-fixture.exe
          if ($LASTEXITCODE -ne 2) { throw 'Missing client was not refused' }
          $report=Get-Content (Join-Path $env:LOCALAPPDATA 'Eidolon/last-launch-error.txt') -Raw
          if ($report -notmatch 'Etape=fichiers-du-paquet ; Code=CLIENT_EXE_MISSING') { throw 'Safe diagnostic missing' }
          if ($report -match 'ecc_|dpapi|password') { throw 'Unexpected credential in diagnostic' }
          # Exact native launcher invocation: no ClientExe parameter, from another directory.
          powershell -NoProfile -File ../windows/eidolon-open.ps1
          if ($LASTEXITCODE -ne 2) { throw 'Default path binding failed before the controlled diagnostic' }
          $report=Get-Content (Join-Path $env:LOCALAPPDATA 'Eidolon/last-launch-error.txt') -Raw
          if ($report -notmatch 'Etape=fichiers-du-paquet ; Code=CLIENT_EXE_MISSING') { throw 'Default client was not resolved from the script directory' }
          exit 0 # expected child failures above are test outcomes
      - name: Native client tests and release build (locked dependencies)
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the icon launcher and desktop shortcut
        shell: powershell
        run: |
          powershell -NoProfile -File ../windows/build-launcher.ps1 -OutputDirectory target/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $nativeSources=@('EidolonLauncher.cs','PixyControl.cs','NativeProtocolTests.cs') | ForEach-Object { (Resolve-Path (Join-Path '../windows' $_)).Path }
          $nativeTests=Join-Path (Resolve-Path 'target/release').Path 'native-tests.exe'
          & $compiler /nologo /target:exe /main:NativeProtocolTests /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Security.dll /reference:System.Web.Extensions.dll "/out:$nativeTests" $nativeSources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/native-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File ../windows/test-launcher.ps1 -LauncherExe target/release/Eidolon.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse Windows scripts and exercise side-effect-free previews
        shell: powershell
        run: |
          $exe=(Resolve-Path target/release/eidolon-consultation.exe).Path
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash
          $script=(Resolve-Path ../windows/eidolon-resident.ps1).Path
          $scriptHash=(Get-FileHash $script -Algorithm SHA256).Hash
          powershell -NoProfile -STA -File $script -ClientExe $exe -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File ../windows/eidolon-startup.ps1 -ResidentScript $script -ScriptSha256 $scriptHash -ClientExe $exe -ClientSha256 $hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the resident in this disposable runner, with no Core/tunnel.
          $listener = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $testPort = $listener.LocalEndpoint.Port
          $listener.Stop()
          $residentArgs = @('-NoProfile','-STA','-File',('"'+$script+'"'),'-ClientExe',('"'+$exe+'"'),'-ExpectedSha256',$hash,'-Port',$testPort,'-Run')
          $resident = Start-Process powershell -ArgumentList $residentArgs -PassThru -RedirectStandardError "$env:RUNNER_TEMP/resident-errors.txt"
          try {
            Start-Sleep -Seconds 4
            if ($resident.HasExited) { throw ('Resident exited: '+(Get-Content "$env:RUNNER_TEMP/resident-errors.txt" -Raw)) }
            if ((Get-Item "$env:RUNNER_TEMP/resident-errors.txt").Length -gt 0) { throw 'Resident emitted an error' }
          } finally {
            if (-not $resident.HasExited) { $resident.Kill(); $resident.WaitForExit() }
            $resident.Dispose()
          }
          # Register/remove only this isolated runner's exact startup value.
          $registry='HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $before=Get-ItemProperty -LiteralPath $registry -Name EidolonCore -ErrorAction SilentlyContinue
          if ($null -ne $before) { throw 'Runner startup value already exists' }
          try {
            powershell -NoProfile -File ../windows/eidolon-startup.ps1 -ResidentScript $script -ScriptSha256 $scriptHash -ClientExe $exe -ClientSha256 $hash -Apply
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $registered=Get-ItemProperty -LiteralPath $registry -Name EidolonCore
            if (-not $registered.EidolonCore.Contains($hash)) { throw 'Startup command is not pinned' }
          } finally {
            powershell -NoProfile -File ../windows/eidolon-startup.ps1 -ResidentScript $script -ScriptSha256 $scriptHash -ClientExe $exe -ClientSha256 $hash -Remove -Apply
          }
          if ($null -ne (Get-ItemProperty -LiteralPath $registry -Name EidolonCore -ErrorAction SilentlyContinue)) { throw 'Startup value was not removed' }
          "$hash  eidolon-consultation.exe" | Out-File -Encoding ascii target/release/SHA256SUMS.txt
      - name: Prepare the user ZIP
        shell: powershell
        run: |
          $package=Join-Path $env:RUNNER_TEMP 'eidolon-pc-g286'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item target/release/Eidolon.exe,target/release/eidolon-consultation.exe,target/release/Eidolon-camera.exe -Destination $package
          Copy-Item ../windows/LIRE-MOI-G286.txt -Destination $package
          Get-ChildItem $package -File | ForEach-Object { ((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()+'  '+$_.Name) } | Set-Content -Encoding ascii (Join-Path $package 'SHA256SUMS.txt')
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath target/release/eidolon-pc-g286.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eidolon-windows-candidate
          path: |
            eidolon-core/desktop/tauri/target/release/eidolon-consultation.exe
            eidolon-core/desktop/tauri/target/release/Eidolon.exe
            eidolon-core/desktop/tauri/target/release/Eidolon-camera.exe
            eidolon-core/desktop/tauri/target/release/eidolon-pc-g286.zip
            eidolon-core/desktop/tauri/target/release/SHA256SUMS.txt
            eidolon-core/desktop/windows/*.ps1
