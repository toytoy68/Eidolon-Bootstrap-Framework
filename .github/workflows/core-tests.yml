name: Core isolated tests
on:
  workflow_dispatch:
  push:
    branches: [feat/eidolon-core-v0.1]
    paths:
      - 'eidolon-core/src/**'
      - 'eidolon-core/tests/**'
      - 'eidolon-core/pyproject.toml'
      - '.github/workflows/core-tests.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eidolon-core
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1
      - name: Compile
        run: python -m compileall -q src tests
      - name: Core test suite
        run: python -m pytest -q -rs -p no:cacheprovider tests --basetemp="$RUNNER_TEMP/pytest-core"
