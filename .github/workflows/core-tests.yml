name: Core isolated tests
on:
  workflow_dispatch:
  push:
    branches: [feat/eidolon-core-v0.1]
    paths:
      - 'eidolon-core/src/**'
      - 'eidolon-core/tests/**'
      - 'eidolon-core/weekend/**/*.py'
      - 'eidolon-core/weekend/**/*.json'
      - 'eidolon-core/weekend/**/*.ps1'
      - 'eidolon-core/weekend/**/*.in'
      - 'eidolon-core/tools/build_weekend_bundle.py'
      - 'eidolon-core/desktop/connected/**'
      - 'eidolon-core/pyproject.toml'
      - '.github/workflows/core-tests.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eidolon-core
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src:${{ github.workspace }}/memory-reference
      EIDOLON_MEMORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Memory Engine integration reference
        uses: actions/checkout@v4
        with:
          repository: toytoy68/Eidolon-Memory-Engine
          ref: be53d1cab3e1c643469658ad02803a1bee302148
          path: memory-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age openssl ffmpeg poppler-utils
          python -m pip install pytest==9.1.1 "cryptography>=43,<51" -r ../memory-reference/requirements.txt -r ../memory-reference/requirements-qdrant.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Connected desktop bundle and contract tests
        run: |
          node desktop/connected/build.js --check
          node --test desktop/connected/tests/*.test.js
      - name: Core test suite
        run: python -m pytest -q -rs -p no:cacheprovider tests --basetemp="$RUNNER_TEMP/pytest-core"
      - name: Bridge credential owner probes with real UID changes
        run: sudo --preserve-env=PYTHONPATH "$(command -v python)" -m pytest -q -rs -W error -p no:cacheprovider tests/test_bridge_credentials_claude_g235.py --basetemp="$RUNNER_TEMP/pytest-credential-owners"
  identity-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eidolon-core
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned identity runtimes and synthetic model tooling
        run: python -m pip install '.[identity]' pytest==9.1.1 onnx==1.19.1 kaldi-native-fbank==1.21.3
      - name: Real CPU inference on synthetic data and generated ONNX model
        run: |
          python -c "import numpy, onnxruntime, cv2, onnx, kaldi_native_fbank"
          python -m pytest -q -rs tests/test_identity_runners.py::Fbank tests/test_identity_runners.py::WeSpeakerRunnerTests --junitxml="$RUNNER_TEMP/identity.xml"
          python -c 'import os, xml.etree.ElementTree as E; r=E.parse(os.environ["RUNNER_TEMP"]+"/identity.xml"); assert sum(int(s.get("tests",0)) for s in r.iter("testsuite")) == 4; assert all(int(s.get("skipped",0)) == 0 for s in r.iter("testsuite"))'
