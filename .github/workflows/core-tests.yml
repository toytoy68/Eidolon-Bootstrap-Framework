name: Core isolated tests
on:
  workflow_dispatch:
  push:
    branches: [feat/eidolon-core-v0.1]
    paths:
      - 'eidolon-core/src/**'
      - 'eidolon-core/tests/**'
      - 'eidolon-core/desktop/connected/**'
      - 'eidolon-core/pyproject.toml'
      - '.github/workflows/core-tests.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eidolon-core
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src:${{ github.workspace }}/memory-reference
      EIDOLON_MEMORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Memory Engine integration reference
        uses: actions/checkout@v4
        with:
          repository: toytoy68/Eidolon-Memory-Engine
          ref: 4d288dce3adb9ab126c31a43d14e47431e7c8ad6
          path: memory-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age openssl ffmpeg
          python -m pip install pytest==9.1.1 "cryptography>=43,<51" -r ../memory-reference/requirements.txt -r ../memory-reference/requirements-qdrant.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Connected desktop bundle and contract tests
        run: |
          node desktop/connected/build.js --check
          node --test desktop/connected/tests/*.test.js
      - name: Core test suite
        run: python -m pytest -q -rs -p no:cacheprovider tests --basetemp="$RUNNER_TEMP/pytest-core"
      - name: Bridge credential owner probes with real UID changes
        run: sudo --preserve-env=PYTHONPATH "$(command -v python)" -m pytest -q -rs -W error -p no:cacheprovider tests/test_bridge_credentials_claude_g235.py --basetemp="$RUNNER_TEMP/pytest-credential-owners"
