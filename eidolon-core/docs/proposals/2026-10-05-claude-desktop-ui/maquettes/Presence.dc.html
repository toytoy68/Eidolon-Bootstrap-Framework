<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Eidolon — Présence</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.eid-breathe .iris{animation:eid-breathe 4s ease-in-out infinite}
.eid-listen .iris{animation:eid-pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.eid-listen .ring{animation:eid-breathe 1.1s ease-in-out infinite}
.eid-think .ring{animation:eid-spin 2.2s linear infinite;transform-box:fill-box;transform-origin:center}
.eid-think .pupil{animation:eid-look 3.2s ease-in-out infinite}
.eid-alert .ring{animation:eid-breathe 1.4s ease-in-out infinite}
@keyframes eid-breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes eid-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes eid-spin{to{transform:rotate(360deg)}}
@keyframes eid-look{0%,100%{transform:translate(0,0)}30%{transform:translate(-3px,1px)}65%{transform:translate(3px,-1px)}}
@media (prefers-reduced-motion: reduce){svg *{animation:none!important}}
</style>
</helmet>
<div style="width: 1280px; height: 640px; box-sizing: border-box; padding: 48px 56px; background: #181B20; color: #E8EAED; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">La présence d’Eidolon</h1>
<p style="margin: 0; color: #C9CED6; font-size: 16px">Un œil dans le coin de la fenêtre. Il suit l’état réel du système, jamais une animation décorative.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex: 1">
<sc-for list="{{states}}" as="e" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 22px; padding: 20px; border-radius: 14px; background: #1F2329; border: 1px solid #2C323C">
<svg class="{{e.cls}}" width="112" height="112" viewBox="0 0 64 64" aria-hidden="true" style="flex: none; filter: drop-shadow(0 0 16px {{e.glow}})">
<defs><clipPath id="{{e.clipId}}"><circle cx="32" cy="32" r="27"></circle></clipPath></defs>
<circle cx="32" cy="32" r="31" fill="#0B0D11" stroke="#3A404B" stroke-width="1.5"></circle>
<circle class="ring" cx="32" cy="32" r="25" fill="none" stroke="{{e.ring}}" stroke-width="2" stroke-dasharray="{{e.dash}}"></circle>
<g clip-path="url(#{{e.clipId}})">
<circle class="iris" cx="32" cy="32" r="16" fill="{{e.iris}}"></circle>
<circle cx="32" cy="32" r="14" fill="none" stroke="#0B0D11" stroke-opacity="0.35" stroke-width="4"></circle>
<circle class="pupil" cx="32" cy="32" r="{{e.pupil}}" fill="#05070A"></circle>
<circle cx="26.5" cy="26" r="2.6" fill="#FFFFFF" fill-opacity="0.85"></circle>
<rect x="0" y="0" width="64" height="{{e.lid}}" fill="#14171C"></rect>
</g>
</svg>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<strong style="font-size: 18px; font-weight: 600">{{e.label}}</strong>
<span style="color: #C9CED6; font-size: 14px; line-height: 1.45">{{e.when}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (key, label, when, iris, ring, dash, pupil, lid, glow, cls) =>
      ({ clipId: 'eye-' + key, label, when, iris, ring, dash, pupil, lid, glow, cls });
    return {
      states: [
        s('idle', 'En veille', 'Rien en cours. Iris bleu sombre qui respire lentement.', '#2A5BC0', '#2A3F66', '3 7', 6, 0, 'rgba(47,111,224,0.25)', 'eid-breathe'),
        s('listen', 'À l’écoute', 'Tu as appuyé sur « Parler ». Pupille dilatée, anneau plein qui pulse.', '#4C8DFF', '#8FB6FF', 'none', 8.5, 0, 'rgba(76,141,255,0.55)', 'eid-listen'),
        s('work', 'Au travail', 'Une mission tourne sur le serveur. L’anneau tourne, la pupille regarde autour.', '#3F7BEA', '#8FB6FF', '22 9', 5.5, 0, 'rgba(76,141,255,0.4)', 'eid-think'),
        s('attention', 'Attend ton accord', 'Une décision t’attend. Iris orange, anneau qui clignote doucement.', '#E0913F', '#F0A050', '5 4', 6, 0, 'rgba(240,160,80,0.45)', 'eid-alert'),
        s('silence', 'Silence', 'Mode silence. Paupière à moitié fermée, aucun mouvement.', '#24448A', '#2A3F66', '2 8', 6, 30, 'rgba(0,0,0,0)', ''),
        s('offline', 'Injoignable', 'Le serveur ne répond pas. Œil presque fermé et éteint.', '#3A404B', '#3A404B', '2 6', 3, 44, 'rgba(0,0,0,0)', '')
      ]
    };
  }
}
</script>
</body>
</html>
