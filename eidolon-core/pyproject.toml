[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-core"
version = "0.1.0"
description = "Sequential, evidence-driven Eidolon mission runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
darme-ssh = ["cryptography>=43,<51"]

[project.scripts]
eidolon-core = "eidolon_core.cli:main"
eidolon-media = "eidolon_core.media_cli:main"
eidolon-media-worker = "eidolon_core.media_worker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
