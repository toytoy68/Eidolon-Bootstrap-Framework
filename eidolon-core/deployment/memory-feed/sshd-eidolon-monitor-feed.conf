# Eidolon G166 — /etc/ssh/sshd_config.d/eidolon-monitor-feed.conf sur Memory (à installer par Codex).
# Le compte ne peut que lire une ligne de statut DARME : pas de terminal, pas de transfert, pas d'agent,
# clé publique seulement, commande forcée quel que soit ce que le client demande.
# <IP_CORE> : adresse de la VM Core, remplie sur la VM, JAMAIS dans Git.
Match User eidolon-monitor-feed
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/bin/python3 -I /usr/local/lib/eidolon/darme-status-feed
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 1
    AuthorizedKeysFile /etc/ssh/eidolon-monitor-feed/authorized_keys
